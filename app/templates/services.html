{% extends "base.html" %}
{% from "_macros.html" import page_header with context %}
{% block content %}
{{ page_header(page.title) }}
<section class="section"><div class="container">
  <div class="rich mb-4">{{ page.body_html|safe }}</div>
  <div class="row g-3">
    {% for s in services %}
    <div class="col-md-6 col-lg-4">
      <a class="card-link" href="{{ url_for('public.service_detail', slug=s.slug) }}">
        <h2 class="h3">{{ s.title }}</h2>
        <p>{{ s.summary }}</p>
        <span class="more">Read more</span>
      </a>
    </div>
    {% endfor %}
  </div>
</div></section>
{% endblock %}
